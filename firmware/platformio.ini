; PlatformIO project configuration for the AgriRover ESP32 firmware.
; Board: ESP32 DevKit V1 (WROOM-32). Framework: Arduino (FreeRTOS built in).

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=3
    ; Provide credentials at build time to keep them out of source control:
    ; -D WIFI_SSID='"my-ssid"'
    ; -D WIFI_PASSWORD='"my-pass"'
    ; -D MQTT_BROKER_HOST='"192.168.1.10"'

lib_deps =
    knolleary/PubSubClient @ ^2.8        ; MQTT (BOM #108)
    mikalhart/TinyGPSPlus @ ^1.0.3       ; NMEA parsing (BOM #109)
    adafruit/DHT sensor library @ ^1.4.6 ; DHT22 (BOM #32)
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    ; RS485/Modbus handled manually in sensors.cpp (no extra lib required)
