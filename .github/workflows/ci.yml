name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install clang and ruff
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          pip install ruff

      - name: C++ syntax check
        # Note: only .cpp files are checked directly. Header-only changes are
        # validated transitively because each header is #included by at least
        # one .cpp file in the build.
        run: |
          for f in firmware/src/*.cpp; do
            echo "Checking $f"
            clang++ -fsyntax-only -std=gnu++17 \
              -I firmware/test/mocks \
              -I firmware/include \
              -I firmware/src \
              "$f"
          done

      - name: C++ host tests
        run: |
          clang++ -std=gnu++17 \
            -I firmware/test/mocks \
            -I firmware/include \
            -I firmware/src \
            firmware/src/sensors.cpp \
            firmware/src/gps.cpp \
            firmware/test/test_modbus.cpp \
            -o /tmp/test_host
          /tmp/test_host

      - name: Python compile check
        run: find pi -name '*.py' -exec python -m py_compile {} +

      - name: ROS 2 Python compile check
        run: find ros2 -name '*.py' -exec python -m py_compile {} +

      - name: Ruff lint
        run: |
          cd pi && ruff check .
          cd .. && ruff check ros2

      - name: Validate training notebooks
        run: |
          python -c "
          import json, sys
          notebooks = ['training/disease_classification.ipynb', 'training/weed_detection.ipynb', 'training/obstacle_detection.ipynb']
          for nb_path in notebooks:
              with open(nb_path) as f:
                  nb = json.load(f)
              assert nb.get('nbformat') == 4, f'{nb_path}: bad nbformat'
              assert len(nb.get('cells', [])) >= 8, f'{nb_path}: too few cells'
              print(f'{nb_path}: OK ({len(nb[\"cells\"])} cells)')
          "

      - name: Python import smoke test
        run: |
          cd pi
          python -c "from sim.rover_model import RoverSim; from mission.scheduler import MissionScheduler; from data.prescription_map import PrescriptionMap; print('Import OK')"
