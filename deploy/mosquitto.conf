# Hardened Mosquitto config for AgriRover.
# Install to /etc/mosquitto/conf.d/agrorover.conf and restart mosquitto.

# No anonymous access - clients must authenticate.
allow_anonymous false
password_file /etc/mosquitto/passwd

# Topic-level authorization.
acl_file /etc/mosquitto/acl

# TLS listener (encrypted). Generate certs with your own CA.
listener 8883
cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile  /etc/mosquitto/certs/server.key
tls_version tlsv1.2

# Do NOT expose a plaintext listener in production. If you must run one for
# local debugging, bind it to loopback only:
# listener 1883 127.0.0.1

# Limit abuse.
max_inflight_messages 20
max_queued_messages 100

# Setup (run once):
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd agrorover
#   sudo chmod 600 /etc/mosquitto/passwd
