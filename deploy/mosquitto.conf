# Hardened Mosquitto config for AgriRover.
# Install to /etc/mosquitto/conf.d/agrirover.conf and restart mosquitto.
# Certs + password entries are generated by deploy/gen_certs.sh.
#
# Fleet support: each rover publishes under rover/<rover_id>/. The ACL uses
# wildcard patterns (rover/+/npk etc.) so a single config handles all units.

# ---- Authentication (global — applies to BOTH listeners) ----------------
# No anonymous access anywhere; every client must present user + password.
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd

# Topic-level authorization (see deploy/acl).
acl_file /etc/mosquitto/acl

# ---- Listener 1: TLS (:8883) — anything off the Pi ----------------------
# Dashboard laptops, fleet backends, debugging from the LAN. Clients must
# pin ca.crt (pi/config.py: MQTT_TLS=1, MQTT_PORT=8883, MQTT_CA_CERT=...).
listener 8883
cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile  /etc/mosquitto/certs/server.key
tls_version tlsv1.2

# ---- Listener 2: loopback-only (:1883) — services on the Pi itself ------
# Bound to 127.0.0.1, never reachable from the network. Auth still required
# (per_listener_settings false above makes password/ACL apply here too).
listener 1883 127.0.0.1

# ---- Abuse limits --------------------------------------------------------
max_inflight_messages 20
max_queued_messages 100

# ---- SD-card longevity (docs/farmer-needs-and-durability.md §2.2) --------
# Batch the persistence DB (retained msgs, QoS queues) to disk hourly instead
# of frequently; mosquitto also saves on clean shutdown.
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 3600

# Log to syslog/journald only — volatile (RAM) once `harden_pi.sh --sd-protect`
# is applied, so routine logging never wears the SD card. If the stock
# /etc/mosquitto/mosquitto.conf still has a `log_dest file ...` line, comment
# it out (harden_pi.sh --sd-protect makes /var/log tmpfs regardless).
log_dest syslog
log_type error
log_type warning
log_type notice
connection_messages true
