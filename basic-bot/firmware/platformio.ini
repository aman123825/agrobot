; AgriRover BASIC BOT - ESP32-only firmware (no MQTT/Pi/AI).
; Board: ESP32 DevKit V1. Control + telemetry over mobile WiFi or USB serial.

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32 @ ^6.5.0   ; Arduino core 2.x API (ledcSetup, esp_task_wdt_init)
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -I../shared

lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.0
    ; RS485/Modbus for the NPK probe is hand-rolled in sensors.cpp (no lib)
