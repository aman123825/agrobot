<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<defs><style>.title{font:700 34px Arial;fill:#16341f}.h{font:700 20px Arial;fill:#16341f}.t{font:15px Arial;fill:#213128}.s{font:13px Arial;fill:#44534a}.box{fill:#fff;stroke:#6e8d75;stroke-width:2;rx:14}.power{stroke:#c9323b;stroke-width:4;fill:none}.gnd{stroke:#222;stroke-width:3;fill:none}.sig{stroke:#2877b7;stroke-width:2.5;fill:none}.p33{stroke:#7b4bb3;stroke-width:3;fill:none}.p5{stroke:#df861f;stroke-width:3;fill:none}.dash{stroke-dasharray:8 7}.warn{fill:#fff3d8;stroke:#d58517;stroke-width:2;rx:12}.label{font:700 13px Arial;fill:#1f3125}.pin{font:13px Consolas,monospace;fill:#153e62}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2877b7"/></marker></defs>
<rect width="1600" height="1100" fill="#f4f8f2"/><text x="55" y="55" class="title">AgriRover Basic Bot — Circuit Connection Overview</text><text x="55" y="82" class="s">Matches firmware/include/pins.h • All grounds common • Signal lines blue</text>
<!-- power --> <rect x="55" y="115" width="310" height="210" class="box"/><text x="75" y="148" class="h">3S LiPo + Power Distribution</text><text x="75" y="178" class="t">Battery + → fuse → master switch</text><text x="75" y="205" class="t">→ BTS7960 B+ (left + right)</text><text x="75" y="232" class="t">→ Pump relay contact supply</text><text x="75" y="259" class="t">→ LM2596 IN+</text><text x="75" y="286" class="t">Battery − → common star ground</text>
<rect x="430" y="125" width="240" height="185" class="box"/><text x="450" y="158" class="h">LM2596 Buck</text><text x="450" y="190" class="t">Set output to 5.00 V first</text><text x="450" y="220" class="t">5 V → DevKit VIN</text><text x="450" y="247" class="t">5 V → ESP32-CAM</text><text x="450" y="274" class="t">5 V → HC-SR04 + servo</text><path d="M365 220 H430" class="power"/><path d="M365 285 H430" class="gnd"/>
<!-- esp --> <rect x="620" y="365" width="370" height="560" class="box"/><text x="705" y="405" class="h">ESP32 DevKit V1</text><text x="650" y="440" class="pin">GPIO19 → Left BTS7960 RPWM</text><text x="650" y="467" class="pin">GPIO21 → Left BTS7960 LPWM</text><text x="650" y="494" class="pin">GPIO22 → Right BTS7960 RPWM</text><text x="650" y="521" class="pin">GPIO23 → Right BTS7960 LPWM</text><text x="650" y="562" class="pin">GPIO25 → Left ultrasonic TRIG</text><text x="650" y="589" class="pin">GPIO18 ← Left ECHO divider</text><text x="650" y="616" class="pin">GPIO32 → Center TRIG</text><text x="650" y="643" class="pin">GPIO33 ← Center ECHO divider</text><text x="650" y="670" class="pin">GPIO15 → Right TRIG</text><text x="650" y="697" class="pin">GPIO39 ← Right ECHO divider</text><text x="650" y="738" class="pin">GPIO17 → RS485 DI</text><text x="650" y="765" class="pin">GPIO16 ← RS485 RO (3.3 V-safe)</text><text x="650" y="792" class="pin">GPIO4 → RS485 DE + /RE</text><text x="650" y="833" class="pin">GPIO14 ↔ DHT22 DATA + 10k↑</text><text x="650" y="860" class="pin">GPIO34 ← Moisture AOUT (3.3 V)</text><text x="650" y="887" class="pin">GPIO35 ← Battery 39k/10k divider</text>
<!-- motors --> <rect x="55" y="395" width="300" height="190" class="box"/><text x="75" y="430" class="h">Left BTS7960</text><text x="75" y="462" class="t">RPWM ← GPIO19 • LPWM ← GPIO21</text><text x="75" y="490" class="t">VCC, R_EN, L_EN → 3.3 V</text><text x="75" y="518" class="t">GND → common ground</text><text x="75" y="546" class="t">B+/B− → battery • M+/M− → motor</text><rect x="55" y="620" width="300" height="190" class="box"/><text x="75" y="655" class="h">Right BTS7960</text><text x="75" y="687" class="t">RPWM ← GPIO22 • LPWM ← GPIO23</text><text x="75" y="715" class="t">VCC, R_EN, L_EN → 3.3 V</text><text x="75" y="743" class="t">GND → common ground</text><text x="75" y="771" class="t">B+/B− → battery • M+/M− → motor</text><path d="M355 465 H620" class="sig" marker-end="url(#a)"/><path d="M355 690 H620" class="sig" marker-end="url(#a)"/>
<!-- ultrasonics --> <rect x="1040" y="115" width="500" height="210" class="box"/><text x="1065" y="150" class="h">3 × HC-SR04 (5 V)</text><text x="1065" y="182" class="t">Left: TRIG GPIO25 • ECHO → 10k/10k divider → GPIO18</text><text x="1065" y="212" class="t">Center: TRIG GPIO32 • ECHO → divider → GPIO33</text><text x="1065" y="242" class="t">Right: TRIG GPIO15 • ECHO → divider → GPIO39</text><text x="1065" y="280" class="label">ECHO ─ 10k ─┬─ GPIO</text><text x="1265" y="300" class="label">└─ 10k ─ GND</text><path d="M990 585 C1050 585 1020 220 1040 220" class="sig"/>
<!-- sensors --> <rect x="1040" y="365" width="500" height="220" class="box"/><text x="1065" y="400" class="h">Environment + Battery Sensors</text><text x="1065" y="435" class="t">DHT22: 3.3 V • GND • DATA GPIO14 + 10k to 3.3 V</text><text x="1065" y="470" class="t">Moisture: 3.3 V only • GND • AOUT GPIO34</text><text x="1065" y="505" class="t">Battery+: 39k → GPIO35 → 10k → GND</text><text x="1065" y="545" class="s">12.6 V battery gives ≈2.57 V at GPIO35</text><path d="M990 845 H1040" class="sig"/>
<!-- rs485 --> <rect x="1040" y="625" width="500" height="175" class="box"/><text x="1065" y="660" class="h">3.3 V-safe RS485 Transceiver + NPK</text><text x="1065" y="692" class="t">DI GPIO17 • RO GPIO16 • DE+/RE GPIO4 • common GND</text><text x="1065" y="722" class="t">A/B → NPK A/B twisted pair</text><text x="1065" y="752" class="t">Power NPK from label-rated supply (many require 9–24 V)</text><path d="M990 760 H1040" class="sig"/>
<!-- dosing --> <rect x="55" y="850" width="500" height="190" class="box"/><text x="75" y="885" class="h">Dosing: Relay + Pump + MG995</text><text x="75" y="918" class="t">Relay IN ← GPIO26 + 10k pull-up to 3.3 V (active LOW)</text><text x="75" y="948" class="t">Relay COM ← fused pump + • NO → pump + • pump − → supply −</text><text x="75" y="978" class="t">MG995 signal ← GPIO13 + 10k pull-down to GND</text><text x="75" y="1008" class="t">MG995 red → strong 5 V branch • brown/black → common GND</text><path d="M555 940 C590 940 590 910 620 910" class="sig"/>
<!-- camera --> <rect x="1040" y="850" width="500" height="150" class="box"/><text x="1065" y="885" class="h">ESP32-CAM (separate board)</text><text x="1065" y="917" class="t">5 V from stable buck branch • GND common</text><text x="1065" y="947" class="t">No signal wire to DevKit — WiFi at static IP 192.168.4.2</text><text x="1065" y="977" class="s">Flashing: UART TX→U0R, RX→U0T, IO0→GND temporarily</text>
<!-- rails --> <path d="M670 210 H850 V365" class="p5"/><text x="695" y="200" class="label">5 V rail</text><path d="M990 430 H1015 V1000" class="p33 dash"/><text x="1002" y="420" class="label">3.3 V / signal</text><path d="M365 300 H590 V1045 H1540" class="gnd dash"/><text x="700" y="1070" class="label">COMMON GROUND — use star distribution; keep motor/servo return current out of ESP32 ground lead</text>
<rect x="430" y="335" width="170" height="90" class="warn"/><text x="450" y="365" class="label">HARDWARE E-STOP</text><text x="450" y="390" class="s">Use NC latching switch</text><text x="450" y="410" class="s">in actuator power feed.</text>
</svg>