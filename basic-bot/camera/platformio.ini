; AgriRover BASIC BOT - ESP32-CAM (AI-Thinker) live video stream.
; Separate board/binary from the DevKit drive firmware. Joins the DevKit's
; AgriRover-Control AP at 192.168.4.2 and streams MJPEG to phone/laptop browsers.

[env:esp32cam]
platform = espressif32 @ ^6.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_flags =
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=0
    -I../shared
